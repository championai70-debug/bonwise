name: Price data diagnostic
on:
  pull_request:
    paths: [".github/workflows/data-diag.yml"]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Open Prices filters from its source code
        run: |
          set +e
          git clone -q --depth 1 https://github.com/openfoodfacts/open-prices.git op
          cd op && git log -1 --format=%cd
          for f in $(grep -rl "FilterSet" --include=*.py . | grep -v test | head -8); do echo "=== $f"; grep -nE "class |fields|= (django_)?filters\.|field_name|lookup_expr|\"__|__\w+\"" "$f" | head -60; done
          echo "=== urls"; grep -rn "path(\|register(" --include=urls.py . | head -30
          UA="Bonwise/1.0 (https://bonwise.onrender.com)"
          B="https://prices.openfoodfacts.org/api/v1/prices?currency=EUR&size=1"
          for f in location__osm_address_country_code=DE location_osm_address_country_code=DE "location__osm_address_country=Deutschland" location__osm_brand=REWE location_osm_brand=REWE; do
            echo "$f -> $(curl -s -m 30 -A "$UA" "$B&$f" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("total"))')"
          done
