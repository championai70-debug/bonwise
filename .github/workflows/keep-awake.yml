# Backup for keeping the live site awake. Render's free plan puts a web service to sleep
# after 15 minutes without visits; the next visitor then waits up to a minute. The server
# now keeps itself awake (keep_awake() in app.py); this workflow wakes it again if it ever
# fell asleep anyway, e.g. after Render restarted it. GitHub runs scheduled workflows much
# less often than asked (about hourly instead of every 10 minutes), so it can't be the
# only guard. The app also opens instantly from the phone's copy, see static/sw.js.
# A paid Render plan never sleeps; then this workflow can be switched off.
# Uses repository variable APP_URL if set, else https://bonwise.onrender.com
name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit /api/health
        env:
          APP_URL: ${{ vars.APP_URL || 'https://bonwise.onrender.com' }}
        run: |
          for i in 1 2 3 4; do
            if curl -fsS --max-time 60 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" "$APP_URL/api/health"; then exit 0; fi
            sleep 10
          done
          echo "::warning::$APP_URL/api/health did not answer"
