name: Price data diagnostic
on:
  pull_request:
    paths: [".github/workflows/data-diag.yml"]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Open Prices filters and German coverage
        run: |
          set +e
          UA="Bonwise/1.0 (https://bonwise.onrender.com)"
          for u in https://prices.openfoodfacts.org/api/openapi.json https://prices.openfoodfacts.org/openapi.json https://prices.openfoodfacts.org/api/v1/openapi.json; do
            code=$(curl -s -m 30 -A "$UA" -o o.json -w "%{http_code}" "$u"); echo "$u -> $code $(head -c 60 o.json)"
            python3 -c "
          import json
          d=json.load(open('o.json'))
          for path in ('/api/v1/prices','/api/v1/locations'):
              op=d['paths'].get(path,{}).get('get',{}); print(path, [p['name'] for p in op.get('parameters',[])])
          " 2>/dev/null && break
          done
          B="https://prices.openfoodfacts.org/api/v1/prices?currency=EUR&size=1"
          for f in location__osm_address_country_code=DE location_osm_address_country_code=DE location__osm_address_country=Deutschland location_osm_address_country=Deutschland; do
            echo "$f -> $(curl -s -m 30 -A "$UA" "$B&$f" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("total"))')"
          done
