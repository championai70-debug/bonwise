<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonwise · Impressum</title>
<meta name="theme-color" content="#FFF6E5">
<link rel="icon" href="/static/favicon.png">
<style>
  :root{--ground:#FFF6E5;--surface:#FFFFFF;--ink:#16112A;--ink-2:#4B4463;--accent:#5B2BD9}
  @media (prefers-color-scheme:dark){:root{--ground:#0D0B14;--surface:#17141F;--ink:#F1EDFA;--ink-2:#B3ACC8;--accent:#A98BFF}}
  body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:680px;margin:0 auto;padding:24px 16px 48px}
  .card{background:var(--surface);border-radius:18px;padding:24px 22px}
  h1{font-size:26px;margin:0 0 14px}
  h2{font-size:17px;margin:22px 0 6px}
  p{margin:0 0 10px;color:var(--ink-2)}
  a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<main><div class="card">
  <h1>Impressum / Legal notice</h1>
  <h2>Angaben gemäß § 5 DDG</h2>
  <p>{{IMPRESSUM}}</p>
  <h2>Datenschutz / Privacy</h2>
  <p><a href="/privacy">Privacy policy</a></p>
</div></main>
</body>
</html>
