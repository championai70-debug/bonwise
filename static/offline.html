<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonwise · offline</title>
<meta name="theme-color" content="#FFF6E5">
<style>
  :root{--ground:#FFF6E5;--surface:#FFFFFF;--ink:#16112A;--ink-2:#4B4463;--accent:#5B2BD9;--accent-ink:#FFFFFF}
  @media (prefers-color-scheme:dark){:root{--ground:#0D0B14;--surface:#17141F;--ink:#F1EDFA;--ink-2:#B3ACC8;--accent:#A98BFF;--accent-ink:#14082E}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ground);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:16px}
  .card{max-width:380px;background:var(--surface);border-radius:18px;padding:28px 24px;text-align:center}
  img{width:72px;height:72px;border-radius:16px}
  h1{font-size:21px;margin:14px 0 6px}
  p{margin:0 0 18px;color:var(--ink-2)}
  .btn{display:inline-block;font-weight:700;border-radius:12px;padding:12px 20px;background:var(--accent);color:var(--accent-ink);text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <img src="/static/icons/icon-192.png" alt="">
    <h1>You’re offline</h1>
    <p>Bonwise needs the internet to read receipts. Your budget and saved receipts are safe on this phone.</p>
    <a class="btn" href="/">Try again</a>
  </div>
</body>
</html>
