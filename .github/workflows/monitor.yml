# Checks the live site every hour, the way a phone uses it: page, security rules, a list
# search in German, reading receipt lines. If something is broken the run fails and GitHub
# emails the repository owner (Settings → Notifications → Actions: "Send notifications for
# failed workflows only"). Optional repository secret STATS_KEY adds the daily usage totals
# to each run's summary. Uses repository variable APP_URL if set.
name: Monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check the live app
        env:
          APP_URL: ${{ vars.APP_URL || 'https://bonwise.onrender.com' }}
          STATS_KEY: ${{ secrets.STATS_KEY }}
        run: python3 tools/monitor.py "$APP_URL"
