name: Price data diagnostic
on:
  pull_request:
    paths: [".github/workflows/data-diag.yml"]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Open Prices schema and German coverage
        run: |
          set +e
          UA="Bonwise/1.0 (https://bonwise.onrender.com)"
          for u in "https://prices.openfoodfacts.org/api/schema/?format=json" "https://prices.openfoodfacts.org/api/schema/" "https://prices.openfoodfacts.org/api/v1/schema/?format=json"; do
            code=$(curl -s -m 30 -A "$UA" -H "Accept: application/json" -o o.json -w "%{http_code}" "$u"); echo "$u -> $code $(head -c 40 o.json | tr '\n' ' ')"
          done
          python3 - <<'PY'
          import json, re
          raw = open("o.json").read()
          try:
              d = json.loads(raw)
          except ValueError:
              # YAML: pull out the parameter names under the prices path
              i = raw.find("/api/v1/prices:")
              seg = raw[i:i+20000]
              print(sorted(set(re.findall(r"name: ([a-zA-Z_]+)", seg)))[:150])
              raise SystemExit
          for path in ("/api/v1/prices", "/api/v1/locations"):
              op = d["paths"].get(path, {}).get("get", {})
              print(path, [p["name"] for p in op.get("parameters", [])])
          PY
